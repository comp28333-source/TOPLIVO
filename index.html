<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Калькулятор расхода топлива</title>
    <style>
        :root {
            --bg-color: #e0e5ec;
            --card-bg: #e0e5ec;
            --text-color: #2d3748;
            --input-bg: #e0e5ec;
            --shadow-out: 9px 9px 16px #a3b1c6, -9px -9px 16px #ffffff;
            --shadow-in: inset 6px 6px 10px #a3b1c6, inset -6px -6px 10px #ffffff;
            --btn-active: inset 4px 4px 8px #a3b1c6, inset -4px -4px 8px #ffffff;
            --accent-color: #3182ce;
            --accent-shadow: 0 4px 12px rgba(49, 130, 206, 0.4);
            --watermark-color: rgba(163, 177, 198, 0.6);
        }

        [data-theme="dark"] {
            --bg-color: #1a202c;
            --card-bg: #1a202c;
            --text-color: #e2e8f0;
            --input-bg: #1a202c;
            --shadow-out: 8px 8px 16px #11151d, -8px -8px 16px #232b3b;
            --shadow-in: inset 5px 5px 8px #11151d, inset -5px -5px 8px #232b3b;
            --btn-active: inset 3px 3px 6px #11151d, inset -3px -3px 6px #232b3b;
            --accent-color: #63b3ed;
            --accent-shadow: 0 4px 12px rgba(99, 179, 237, 0.3);
            --watermark-color: rgba(255, 255, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            transition: background-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            position: relative;
        }

        /* Водяной знак БЛiК в правом нижнем углу экрана */
        .watermark {
            position: fixed;
            bottom: 20px;
            right: 25px;
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--watermark-color);
            pointer-events: none;
            user-select: none;
            letter-spacing: 2px;
            z-index: 100;
        }

        .calculator-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 25px;
            box-shadow: var(--shadow-out);
            width: 100%;
            max-width: 420px;
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .header h2 {
            margin: 0;
            font-size: 1.4rem;
            font-weight: 600;
        }

        .theme-toggle {
            background: var(--card-bg);
            border: none;
            outline: none;
            padding: 10px 14px;
            border-radius: 12px;
            box-shadow: var(--shadow-out);
            cursor: pointer;
            color: var(--text-color);
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .theme-toggle:active {
            box-shadow: var(--btn-active);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            opacity: 0.9;
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            border: none;
            outline: none;
            background: var(--input-bg);
            color: var(--text-color);
            border-radius: 15px;
            box-shadow: var(--shadow-in);
            font-size: 1rem;
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            border: none;
            outline: none;
            border-radius: 15px;
            background: var(--card-bg);
            color: var(--accent-color);
            font-weight: bold;
            font-size: 1.05rem;
            box-shadow: var(--shadow-out);
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-submit:active {
            box-shadow: var(--btn-active);
        }

        .result-box {
            margin-top: 25px;
            padding: 20px;
            border-radius: 18px;
            box-shadow: var(--shadow-in);
            text-align: center;
        }

        .result-box .label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
            opacity: 0.7;
        }

        .result-box .value {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--accent-color);
            text-shadow: var(--accent-shadow);
        }

        .result-details {
            font-size: 0.85rem;
            margin-top: 8px;
            opacity: 0.7;
        }
    </style>
</head>
<body>

<!-- Водяной знак в правом нижнем углу -->
<div class="watermark">БЛiК</div>

<div class="calculator-card">
    <div class="header">
        <h2>Расход топлива</h2>
        <button type="button" class="theme-toggle" id="themeToggle" title="Сменить тему">🌙</button>
    </div>

    <form id="fuelForm" onsubmit="event.preventDefault(); calculate();">
        <div class="form-group">
            <label for="start_date">С ДАТЫ:</label>
            <input type="date" id="start_date" name="start_date" required>
        </div>

        <div class="form-group">
            <label for="end_date">ПО ТЕКУЩУЮ:</label>
            <input type="date" id="end_date" name="end_date" required>
        </div>

        <div class="form-group">
            <label for="liters_per_day">ЛИТРОВ В ДЕНЬ:</label>
            <input type="number" step="0.1" min="0" id="liters_per_day" name="liters_per_day" value="10" required>
        </div>

        <button type="submit" class="btn-submit">РАССЧИТАТЬ</button>
    </form>

    <div class="result-box">
        <div class="label">Результат</div>
        <div class="value" id="resultValue">0 л</div>
        <div class="result-details" id="resultDetails">Период: 0 дн.</div>
    </div>
</div>

<script>
    // Автозаполнение дат по умолчанию
    window.addEventListener('DOMContentLoaded', () => {
        const today = new Date();
        const formatDate = (date) => date.toISOString().split('T')[0];

        const endDateInput = document.getElementById('end_date');
        const startDateInput = document.getElementById('start_date');

        endDateInput.value = formatDate(today);

        const weekAgo = new Date();
        weekAgo.setDate(today.getDate() - 7);
        startDateInput.value = formatDate(weekAgo);

        calculate();
    });

    // Функция расчёта
    function calculate() {
        const startDateStr = document.getElementById('start_date').value;
        const endDateStr = document.getElementById('end_date').value;
        const litersPerDay = parseFloat(document.getElementById('liters_per_day').value) || 0;

        if (!startDateStr || !endDateStr) return;

        const start = new Date(startDateStr);
        const end = new Date(endDateStr);

        const diffTime = end - start;
        let daysDiff = Math.round(diffTime / (1000 * 60 * 60 * 24)) + 1;

        if (daysDiff < 0) {
            daysDiff = 0;
        }

        const totalLiters = daysDiff * litersPerDay;

        document.getElementById('resultValue').textContent = totalLiters.toLocaleString('ru-RU', { minimumFractionDigits: 0, maximumFractionDigits: 2 }) + ' л';
        document.getElementById('resultDetails').textContent = `Период: ${daysDiff} дн.`;
    }

    // Переключение темной/светлой темы с сохранением
    const themeToggleBtn = document.getElementById('themeToggle');
    const currentTheme = localStorage.getItem('theme') || 'light';

    if (currentTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        themeToggleBtn.textContent = '☀️';
    }

    themeToggleBtn.addEventListener('click', () => {
        let theme = document.documentElement.getAttribute('data-theme');
        if (theme === 'dark') {
            document.documentElement.removeAttribute('data-theme');
            localStorage.setItem('theme', 'light');
            themeToggleBtn.textContent = '🌙';
        } else {
            document.documentElement.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
            themeToggleBtn.textContent = '☀️';
        }
    });
</script>

</body>
</html>
